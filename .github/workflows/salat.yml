name: Salat

on:
  push:
    branches: [main]
    paths:
      - "Salat/**"
      - ".github/workflows/salat.yml"
  pull_request:
    paths:
      - "Salat/**"
      - ".github/workflows/salat.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Salat
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('Salat/gradle/libs.versions.toml') }}

      - name: Generate Xcode project
        working-directory: Salat/iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        working-directory: Salat/iosApp
        run: |
          xcodebuild build \
            -project Salat.xcodeproj \
            -scheme Salat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # SideStore signerer appen selv, så en usignert .ipa holder.
      - name: Package .ipa
        working-directory: Salat/iosApp/build
        run: |
          mkdir Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Salat.app Payload/
          zip -qry Salat.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Salat
          path: Salat/iosApp/build/Salat.ipa

      # Legger siste bygg fra main ut som en release, så .ipa-en kan lastes ned rett på telefonen.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: Salat/iosApp/build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete salat-latest --yes --cleanup-tag || true
          gh release create salat-latest Salat.ipa \
            --target "$GITHUB_SHA" \
            --title "Salat (siste bygg)" \
            --notes "Bygget fra $GITHUB_SHA."
